# Dependabot version updates (ENG-1764 AppSec baseline).
# Weekly, like the other repos of the org. Minor and patch updates are grouped
# into one PR per ecosystem; majors stay individual PRs. The open-PR limit is
# deliberately low (the org default is 5) so the first run does not flood the team.

version: 2
updates:

  # manifests: mix.exs / mix.lock
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
